<!-- SPDX-License-Identifier: GPL-3.0-or-later
     MihawkOS title icon (2026-10-31): a Frutiger Aero user tile, original artwork drawn for this project. A white glass
     frame fills the icon, square because the console's icon0.png is RGB with no alpha (rounded corners would show a
     backdrop); in it, a picture of sky over meadow with soft bubbles and a glossy blue user (head and shoulders).
     sce_sys/icon0.png is rendered from this: rsvg-convert -w 512 -h 512 icon0.svg, then saved as 8-bit RGB. -->
